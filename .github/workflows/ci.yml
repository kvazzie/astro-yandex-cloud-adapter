name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm pack:check
      - name: Validate packed exports
        run: node scripts/validate-pack.mjs
      - name: Verify publish payload
        working-directory: packages/adapter
        run: npm publish --dry-run

  astro-compatibility:
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 22.12 / Astro 7.1
            node: 22.12.0
            astro: 7.1.0
            experimental: false
          - name: Node 22.15 / latest Astro 7
            node: 22.15.0
            astro: 7
            experimental: false
          - name: Node 24 LTS / latest Astro 7
            node: 24
            astro: 7
            experimental: false
          - name: Node 24 LTS / Astro next
            node: 24
            astro: next
            experimental: true
    name: Astro compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check experimental Astro release
        if: ${{ matrix.experimental }}
        id: experimental-release
        run: |
          if pnpm view "astro@${{ matrix.astro }}" version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::astro@${{ matrix.astro }} is not currently published; compatibility check skipped"
          fi
      - name: Update Astro
        if: ${{ !matrix.experimental || steps.experimental-release.outputs.available == 'true' }}
        run: pnpm --recursive update "astro@${{ matrix.astro }}"
      - name: Report tested versions
        if: ${{ !matrix.experimental || steps.experimental-release.outputs.available == 'true' }}
        run: |
          node --version
          pnpm exec astro --version
      - name: Build adapter package
        if: ${{ !matrix.experimental || steps.experimental-release.outputs.available == 'true' }}
        run: pnpm build
      - name: Build fixtures and execute generated handlers
        if: ${{ !matrix.experimental || steps.experimental-release.outputs.available == 'true' }}
        run: pnpm test:integration
