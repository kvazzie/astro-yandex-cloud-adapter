name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm pack:check
      - name: Retain checked candidate and identity
        uses: actions/upload-artifact@v7
        with:
          name: checked-package
          path: |
            .artifacts/*.tgz
            .artifacts/package-check.json
          include-hidden-files: true

  beta-release-rehearsal:
    name: Beta release rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record the starting version
        run: echo "STARTING_VERSION=$(node -p 'require("./packages/adapter/package.json").version')" >> "$GITHUB_ENV"
      - run: pnpm release:version
      - name: Verify the prepared beta
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const pkg = JSON.parse(await readFile('packages/adapter/package.json', 'utf8'));
          assert.match(pkg.version, /^0\.1\.0-beta\.[1-9]\d*$/);
          if (process.env.STARTING_VERSION === '0.1.0-beta.0') {
            assert.equal(pkg.version, '0.1.0-beta.1');
          }
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm pack:check
      - name: Retain the rehearsed beta and identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rehearsed-beta
          path: |
            .artifacts/*.tgz
            .artifacts/package-check.json
          include-hidden-files: true

  local-s3:
    name: Local S3 uploads and updates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Install workspace dependencies
        run: devenv shell -- pnpm install --frozen-lockfile
      - name: Test local S3 uploads and updates
        run: devenv test --no-tui
      - name: Show local S3 results
        if: always()
        run: node scripts/show-s3-log.mjs
      - name: Retain local S3 release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: local-s3-results
          path: |
            .artifacts/local-s3.log
            .artifacts/local-s3.xml
            .devenv/s3.log
          include-hidden-files: true

  astro-compatibility:
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Node 22.12 / Astro 7.1
            node: 22.12.0
            astro: 7.1.0
            experimental: false
          - name: Node 22.15 / latest Astro 7
            node: 22.15.0
            astro: 7
            experimental: false
          - name: Node 24 LTS / latest Astro 7
            node: 24
            astro: 7
            experimental: false
          - name: Node 24 LTS / Astro next
            node: 24
            astro: next
            experimental: true
    name: Astro compatibility (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check experimental Astro release
        if: ${{ matrix.experimental }}
        id: experimental-release
        run: |
          if pnpm view "astro@${{ matrix.astro }}" version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::astro@${{ matrix.astro }} is not currently published; compatibility check skipped"
          fi
      - name: Update Astro
        if: ${{ !matrix.experimental || steps.experimental-release.outputs.available == 'true' }}
        run: pnpm --include-workspace-root --recursive update "astro@${{ matrix.astro }}"
      - name: Report tested versions
        if: ${{ !matrix.experimental || steps.experimental-release.outputs.available == 'true' }}
        run: |
          node --version
          pnpm exec astro --version
      - name: Build adapter package
        if: ${{ !matrix.experimental || steps.experimental-release.outputs.available == 'true' }}
        run: pnpm build
      - name: Build fixtures and execute generated handlers
        if: ${{ !matrix.experimental || steps.experimental-release.outputs.available == 'true' }}
        run: pnpm test:integration
