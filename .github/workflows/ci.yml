name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm pack:check
      - name: Validate packed exports
        run: node scripts/validate-pack.mjs
      - name: Verify publish payload
        working-directory: packages/adapter
        run: npm publish --dry-run

  astro-compatibility:
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - astro: ^6.4.0
            experimental: false
          - astro: 7.1.0
            experimental: false
          - astro: ^7.1.0
            experimental: false
          - astro: next
            experimental: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check experimental Astro release
        if: ${{ matrix.experimental }}
        id: experimental-release
        run: |
          if pnpm view "astro@${{ matrix.astro }}" version >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::astro@${{ matrix.astro }} is not currently published; compatibility check skipped"
          fi
      - name: Update Astro
        if: ${{ !matrix.experimental || steps.experimental-release.outputs.available == 'true' }}
        run: pnpm --recursive --filter '!fixture-astro-6' update "astro@${{ matrix.astro }}"
      - name: Test
        if: ${{ !matrix.experimental || steps.experimental-release.outputs.available == 'true' }}
        run: pnpm test
