name: Prepare beta version

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adapter-release
  cancel-in-progress: false

jobs:
  version-policy:
    # Version PR automation is enabled only in the upstream repository.
    if: >-
      github.repository == 'kvazzie/astro-yandex-cloud-adapter' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.policy.outputs.sha }}
    steps:
      # workflow_run must execute only the workflow's main source, never PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require successful push CI on the current main commit
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-version-policy.mjs

  version:
    needs: version-policy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version-policy.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recheck main before changing version files
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_SHA: ${{ needs.version-policy.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$APPROVED_SHA"
      - name: Prepare versions with native pnpm changesets
        run: pnpm release:version
      - name: Create or update the version pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          base: main
          branch: changeset-release/main
          title: Prepare adapter release
          commit-message: Prepare adapter release
          add-paths: |
            .changeset/
            packages/adapter/package.json
            packages/adapter/CHANGELOG.md
            pnpm-lock.yaml
          body: |
            Prepare the adapter beta from the reviewed change intents using `pnpm release:version`.

            Review the generated version, changelog, ledger and CI evidence. The Changesets check reproduces these files from the base commit.

            Merging this PR does not publish a package. Publication remains a separate manually dispatched workflow with human approval in the npm environment.
